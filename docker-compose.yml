services:
  postgres:
    image: postgres:16
    container_name: avito-kitchen-postgres
    environment:
      POSTGRES_DB: avito_kitchen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avito_kitchen"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avito-kitchen-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/avito_kitchen
      RESTAURANT_SERVICE_URL: http://restaurant-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      restaurant-service:
        condition: service_started

  restaurant-service:
    build:
      context: .
      dockerfile: restaurant_service/Dockerfile
    container_name: avito-kitchen-restaurant
    ports:
      - "8081:8081"

volumes:
  postgres_data: