openapi: 3.0.3

info:
  title: Avito.Kitchen API
  description: MVP API для заказа еды из ресторанов
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      summary: Проверка работоспособности API
      responses:
        '200':
          description: API работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /restaurants:
    get:
      summary: Получить список ресторанов
      responses:
        '200':
          description: Список ресторанов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '500':
          description: Ошибка базы данных

  /restaurants/{id}:
    get:
      summary: Получить ресторан
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Ресторан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          description: Некорректный ID
        '404':
          description: Ресторан не найден

  /restaurants/{id}/menu:
    get:
      summary: Получить меню ресторана
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Меню ресторана
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '400':
          description: Некорректный ID
        '500':
          description: Ошибка базы данных

  /orders:
    post:
      summary: Создать заказ
      description: >
        Создаёт заказ, проверяет существование ресторана,
        наличие товаров и актуальные цены. После создания
        заказ передаётся в restaurant-service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            example:
              restaurant_id: 1
              items:
                - menu_item_id: 1
                  quantity: 2
                - menu_item_id: 2
                  quantity: 1
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Некорректные данные или товар недоступен
        '502':
          description: Restaurant service недоступен
        '500':
          description: Внутренняя ошибка

  /orders/{id}:
    get:
      summary: Получить заказ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Некорректный ID
        '404':
          description: Заказ не найден
        '500':
          description: Ошибка базы данных

components:
  schemas:

    Restaurant:
      type: object
      required:
        - id
        - name
        - address
        - status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Пицца Хаус
        address:
          type: string
          example: ул. Ленина, 10
        status:
          type: string
          example: active

    MenuItem:
      type: object
      required:
        - id
        - restaurant_id
        - name
        - description
        - price
        - available
      properties:
        id:
          type: integer
          example: 1
        restaurant_id:
          type: integer
          example: 1
        name:
          type: string
          example: Пицца Пепперони
        description:
          type: string
          example: Пицца с пепперони и сыром
        price:
          type: number
          format: double
          example: 599.00
        available:
          type: boolean
          example: true

    OrderCreateRequest:
      type: object
      required:
        - restaurant_id
        - items
      properties:
        restaurant_id:
          type: integer
          example: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderCreateItem'

    OrderCreateItem:
      type: object
      required:
        - menu_item_id
        - quantity
      properties:
        menu_item_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    Order:
      type: object
      required:
        - id
        - restaurant_id
        - items
        - total_price
        - status
      properties:
        id:
          type: integer
          example: 3
        restaurant_id:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_price:
          type: number
          format: double
          example: 1697.00
        status:
          type: string
          example: created

    OrderItem:
      type: object
      required:
        - menu_item_id
        - name
        - price
        - quantity
      properties:
        menu_item_id:
          type: integer
          example: 1
        name:
          type: string
          example: Пицца Пепперони
        price:
          type: number
          format: double
          example: 599.00
        quantity:
          type: integer
          minimum: 1
          example: 2